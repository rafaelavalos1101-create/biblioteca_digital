{% extends "base.html" %}
{% block titulo %}Registrar instrucción{% endblock %}
{% block contenido %}
<h1>Registrar instrucción</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}

<form class="formulario" method="POST" action="/instrucciones/nueva">
  <label for="codigo">Código</label>
  <input type="text" id="codigo" name="codigo" placeholder="Ejemplo: IT-007" value="{{ datos.codigo }}">

  <label for="nombre">Nombre de la instrucción</label>
  <input type="text" id="nombre" name="nombre" placeholder="Ejemplo: Revisión de colores" value="{{ datos.nombre }}">

  <label for="area">Área</label>
  <input type="text" id="area" name="area" placeholder="Ejemplo: Impresión" value="{{ datos.area }}">

  <label for="version">Versión guardada</label>
  <input type="text" id="version" name="version" placeholder="Ejemplo: 1" value="{{ datos.version }}">

  <label for="version_aprobada">Versión aprobada por calidad</label>
  <input type="text" id="version_aprobada" name="version_aprobada" placeholder="Ejemplo: 1" value="{{ datos.version_aprobada }}">

  <div class="botones">
    <button type="submit">Guardar</button>
    <a class="enlace-cancelar" href="/instrucciones">Cancelar</a>
  </div>
</form>
{% endblock %}
